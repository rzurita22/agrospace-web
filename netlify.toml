[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/adafruit"
  to = "/.netlify/functions/adafruit"
  status = 200

[[redirects]]
  from = "/api/apps-script"
  to = "/.netlify/functions/apps-script"
  status = 200

[[redirects]]
  from = "/chat"
  to = "/chat.html"
  status = 200

